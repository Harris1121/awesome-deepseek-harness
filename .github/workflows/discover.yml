name: Discover DSH Projects

on:
  schedule:
    - cron: "15 1 * * *"  # 09:15 Beijing
  workflow_dispatch:

concurrency:
  group: discover-dsh-projects
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -u scripts/discover.py
      - name: Commit candidate pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repositories.json
          if git diff --cached --quiet; then
            echo "No discovery changes."
          else
            git commit -m "chore: discover DSH projects"
            git pull --rebase origin main
            git push origin main
          fi
