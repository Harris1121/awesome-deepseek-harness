name: Update DSH Rankings

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Discover DSH Projects"]
    types: [completed]

concurrency:
  group: update-dsh-rankings
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update rankings with GitHub GraphQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -u scripts/update_rankings.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No ranking changes."
          else
            git commit -m "chore: update DSH rankings"
            git pull --rebase origin main
            git push origin main
          fi
