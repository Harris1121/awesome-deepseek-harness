name: Classify DSH Ecosystem

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update DSH Rankings"]
    types: [completed]

concurrency:
  group: classify-dsh-ecosystem
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  classify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Seed competitor classifications
        run: python3 -u scripts/seed_competitor_categories.py
      - name: Classify ecosystem and status
        run: python3 -u scripts/classify.py
      - name: Render README
        run: python3 -u scripts/render_categories.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/competitor-categories.json data/categories.json
          if git diff --cached --quiet; then
            echo "No classification changes."
          else
            git commit -m "docs: refresh ecosystem guide and rankings"
            git pull --rebase origin main
            git push origin main
          fi
