name: Classify DSH Projects

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update DSH Rankings"]
    types: [completed]

concurrency:
  group: classify-dsh-projects
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  classify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Classify and render
        run: |
          python3 -u scripts/classify.py
          python3 -u scripts/render_categories.py

      - name: Supplement thin categories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -u scripts/supplement_categories.py

      - name: Commit classification data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/categories.json data/repositories.json
          if git diff --cached --quiet; then
            echo "No classification changes."
          else
            git commit -m "chore: classify DSH ecosystem"
            git pull --rebase origin main
            git push origin main
          fi
